version: 0.0
os: linux

# Sem isto, o CodeDeploy ABORTA o Install ao encontrar um arquivo que ele não
# instalou (erro "a specified file already exists at this location"). Foi o que
# travou todo deploy entre 20/08 e 27/08/2026: o engine do Prisma
# libquery_engine-debian-openssl-3.0.x.so.node foi criado à mão na EC2 e passou
# a colidir com o do artifact. Pior, o Install falhando dispara o
# `onFailure: ROLLBACK` do pipeline, e a execução de ROLLBACK aparece no console
# como "Succeeded" — o deploy parecia ter subido sem nunca ter subido.
#
# A raiz continua sendo o buildspec empacotar node_modules junto (o que põe
# milhares de binários sob o controle do CodeDeploy); enquanto isso não mudar,
# OVERWRITE é o que mantém o Install idempotente.
file_exists_behavior: OVERWRITE

# Copia o conteúdo do build para a EC2
files:
  - source: /
    destination: /home/ubuntu/clinica-dev

# Garante que os arquivos pertençam ao usuário ubuntu
permissions:
  - object: /home/ubuntu/clinica-dev
    owner: ubuntu
    group: ubuntu
    mode: 755
    type:
      - directory
      - file

# Ciclo de vida do deploy — cada hook roda um script
hooks:
  ApplicationStop:
    - location: scripts/stop.sh
      timeout: 60
      runas: root

  AfterInstall:
    - location: scripts/after_install.sh
      timeout: 600
      runas: root

  ApplicationStart:
    - location: scripts/start.sh
      timeout: 120
      runas: root
